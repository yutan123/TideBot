name: Verify TideBot Local Llama Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-local-llama:
    name: Build and verify llama.cpp APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Install Android native build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Resolve packages
        run: flutter pub get

      - name: Build release APK with llama.cpp
        run: flutter build apk --release --no-pub

      - name: Verify signing and ARM64 llama native library
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK" || { echo "::error::Release APK was not created"; exit 1; }
          APKSIGNER="$(find "${ANDROID_HOME}" -path '*/build-tools/*/apksigner' -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/lib.*(llama|ggml).*\.so' \
            || { echo "::error::llama.cpp ARM64 library is missing from APK"; exit 1; }

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: TideBot-Local-Llama-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
