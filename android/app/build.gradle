plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

def releaseSigning = [
    storePath: System.getenv('ANDROID_KEYSTORE_PATH'),
    storePassword: System.getenv('ANDROID_KEYSTORE_PASSWORD'),
    alias: System.getenv('ANDROID_KEY_ALIAS'),
    keyPassword: System.getenv('ANDROID_KEY_PASSWORD'),
]
def hasReleaseSigning = releaseSigning.values().every { it != null && !it.trim().isEmpty() }

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') }) {
        if (!hasReleaseSigning) {
            throw new GradleException('Release signing requires ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD.')
        }
        if (!project.file(releaseSigning.storePath).isFile()) {
            throw new GradleException('Release signing keystore file does not exist.')
        }
    }
}

android {
    namespace = "com.yutan123.tidebot"
    compileSdk = flutter.compileSdkVersion
    // jni requires NDK 28; Android NDK revisions are backward compatible.
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        // flutter_local_notifications requires Java 8+ library API backports.
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }
    defaultConfig {
        applicationId = "com.yutan123.tidebot.dev"
        minSdkVersion = 26

        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile project.file(releaseSigning.storePath)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.alias
                keyPassword releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}
dependencies {
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.20.0"
    // Required when coreLibraryDesugaringEnabled is true.
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    implementation "androidx.work:work-runtime-ktx:2.10.0"
    // Operation.result exposes ListenableFuture. A full Guava dependency also
    // prevents an empty listenablefuture conflict-avoidance artifact from hiding it.
    implementation "com.google.guava:guava:33.4.0-android"

    implementation "com.google.mlkit:text-recognition-chinese:16.0.1"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
}

flutter {
    source = "../.."
}
