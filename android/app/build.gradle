plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace = "com.yutan123.tidebot"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.yutan123.tidebot"
        // ML Kit Text Recognition requires Android API 23 or higher.
        minSdk = 23

        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    def signingProperties = new Properties()
    def signingPropertiesFile = rootProject.file('key.properties')
    if (signingPropertiesFile.exists()) {
        signingPropertiesFile.withReader('UTF-8') { reader ->
            signingProperties.load(reader)
        }
    }

    def releaseKeystore = project.file(
            signingProperties.getProperty('storeFile', 'tidebot.keystore'))
    def releaseStorePassword = signingProperties.getProperty('storePassword')
    def releaseKeyAlias = signingProperties.getProperty('keyAlias')
    def releaseKeyPassword = signingProperties.getProperty('keyPassword')

    signingConfigs {
        if (releaseKeystore.exists() && releaseStorePassword &&
                releaseKeyAlias && releaseKeyPassword) {
            release {
                storeFile releaseKeystore
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseKeystore.exists() && releaseStorePassword &&
                    releaseKeyAlias && releaseKeyPassword) {
                signingConfig signingConfigs.release
            }
        }
    }
}
dependencies {
    implementation "com.google.mlkit:text-recognition-chinese:16.0.1"
}

flutter {
    source = "../.."
}
