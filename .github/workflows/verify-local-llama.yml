name: 验证 TideBot 本地模型正式版

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-local-llama:
    name: 编译并验证本地模型 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: 获取源码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      # 显式配置 Android 命令行工具，避免 Runner 找不到 sdkmanager。
      - name: 配置 Android 命令行工具
        uses: android-actions/setup-android@v3

      - name: 安装 Android 原生构建工具
        run: |
          sdkmanager --version
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: 获取 Flutter 依赖
        run: flutter pub get

      - name: 编译包含本地模型的正式版 APK
        run: flutter build apk --release --no-pub

      - name: 验证签名和 ARM64 本地模型原生库
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK" || { echo "::error::未生成正式版 APK"; exit 1; }
          APKSIGNER="$(find "${ANDROID_HOME}" -path '*/build-tools/*/apksigner' -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/lib.*(llama|ggml).*\.so' \
            || { echo "::error::APK 中缺少 ARM64 本地模型原生库"; exit 1; }

      - name: 上传已验证的本地模型 APK
        uses: actions/upload-artifact@v4
        with:
          name: TideBot-Local-Llama-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
