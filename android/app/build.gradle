plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace = "com.yutan123.tidebot"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.yutan123.tidebot"
        // ML Kit Text Recognition requires Android API 23 or higher.
        minSdk = 23

        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    def signingProperties = new Properties()
    def signingPropertiesFile = rootProject.file('key.properties')
    if (signingPropertiesFile.exists()) {
        signingPropertiesFile.withReader('UTF-8') { reader ->
            signingProperties.load(reader)
        }
    }
    def configuredStoreFile = signingProperties.getProperty(
            'storeFile', 'tidebot.keystore')
    def releaseKeystore = new File(configuredStoreFile)
    if (!releaseKeystore.isAbsolute()) {
        // 兼容 key.properties 中的两种写法：
        // 1. tidebot.keystore（相对 android/app）
        // 2. app/tidebot.keystore（相对 android 根目录）
        def appRelative = project.file(configuredStoreFile)
        def rootRelative = rootProject.file(configuredStoreFile)
        releaseKeystore = appRelative.isFile() ? appRelative : rootRelative
    }
    def releaseStorePassword = signingProperties.getProperty('storePassword')
    def releaseKeyAlias = signingProperties.getProperty('keyAlias')
    def releaseKeyPassword = signingProperties.getProperty('keyPassword')
    def hasReleaseSigning = releaseKeystore.isFile() &&
            releaseStorePassword?.trim() &&
            releaseKeyAlias?.trim() &&
            releaseKeyPassword?.trim()

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile releaseKeystore
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // Release 永远使用签名配置；签名材料缺失时由下方校验直接失败。
            signingConfig signingConfigs.release
        }
    }

    // Debug 可以在没有发布密钥时构建；任何 Release 任务都必须具备签名材料。
    def requestedReleaseTask = gradle.startParameter.taskNames.any {
        it.toLowerCase().contains('release')
    }
    if (requestedReleaseTask && !hasReleaseSigning) {
        throw new GradleException(
                'Release signing is not configured. Restore android/key.properties '
                + 'and android/app/tidebot.keystore before building a release APK.')
    }
}
dependencies {
    implementation "com.google.mlkit:text-recognition-chinese:16.0.1"
}

flutter {
    source = "../.."
}
