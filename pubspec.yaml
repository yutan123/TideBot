name: tide_bot
description: "TideBot - 本地化沉浸式多模态 AI 伴侣 APP"
publish_to: "none"
version: 1.0.2+3

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 本地存储与极密底座
  sqflite: ^2.3.0
  shared_preferences: ^2.2.3
  package_info_plus: ^8.3.0
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.3

  # 网络与底层通信
  http: ^1.2.1
  # Office Open XML（docx/xlsx/pptx）离线正文提取
  archive: ^4.0.9

  # UI 特效与多模态交互
  flutter_svg: ^2.0.10
  liquid_glass_widgets: ^0.30.2
  rive: ^0.13.0
  # 6.x 的 Android 插件已声明 namespace，兼容 AGP 8+。
  record: ^6.1.1
  audioplayers: ^6.5.0
  heif_converter: ^1.0.7
  image_picker: ^1.1.2
  file_picker: ^8.0.5
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1

  # 后台守护与保活
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^17.1.2

  path: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false # 我们只做安卓
  image_path: "assets/images/logo.png" # 指向你刚上传的 logo
  min_sdk_size: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
  fonts:
    - family: TideFont
      fonts:
        - asset: assets/fonts/TideFont-Regular.ttf
        # 统一指向 Regular，防止因缺少 Bold 字体文件崩溃，Flutter 会自动加粗渲染
        - asset: assets/fonts/TideFont-Regular.ttf
          weight: 700
