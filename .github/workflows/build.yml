name: Build TideBot Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build-release:
    name: Android Release (llama.cpp)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      # GitHub runners do not guarantee sdkmanager is preinstalled or on PATH.
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components and NDK
        run: |
          sdkmanager --version
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Verify Dart compilation
        run: dart analyze --no-fatal-infos --no-fatal-warnings

      - name: Build signed release APK
        run: flutter build apk --release --no-pub

      - name: Verify APK signature
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK" || { echo "::error::Release APK was not created"; exit 1; }
          APKSIGNER="$(find "${ANDROID_HOME}" -path '*/build-tools/*/apksigner' -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload verified release APK
        uses: actions/upload-artifact@v4
        with:
          name: TideBot-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
