plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace = "com.yutan123.tidebot"
    compileSdk = flutter.compileSdkVersion
    // jni requires NDK 28; Android NDK revisions are backward compatible.
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        // flutter_local_notifications requires Java 8+ library API backports.
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }
    defaultConfig {
        applicationId = "com.yutan123.tidebot"
        // llama_flutter_android uses SharedMemory and requires Android 8.0/API 26.
        minSdkVersion = 26

        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    signingConfigs {
        release {
            // This keystore is tracked with the repository so CI and local release
            // builds use the same signing identity without a separate config file.
            storeFile project.file('tidebot.keystore')
            storePassword 'tidebot123'
            keyAlias 'tidebot'
            keyPassword 'tidebot123'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}
dependencies {
    // Required when coreLibraryDesugaringEnabled is true.
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    implementation "com.google.mlkit:text-recognition-chinese:16.0.1"
}

flutter {
    source = "../.."
}
