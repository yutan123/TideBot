name: tide_bot
description: "TideBot - 本地化沉浸式多模态 AI 伴侣 APP"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 本地存储与极密底座
  sqflite: ^2.3.3+1
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.3

  # 网络与底层通信
  http: ^1.2.1

  # UI 特效与多模态交互
  flutter_svg: ^2.0.10+1
  rive: ^0.13.0
  record: ^5.1.2
  audioplayers: ^6.0.0
  heif_converter: ^0.2.1   # HEIC/HEIF 格式转写适配
  image_picker: ^1.1.2
  file_picker: ^8.0.5

  # 后台守护与保活
  flutter_background_service: ^5.0.5
  flutter_local_notifications: ^17.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
  fonts:
    - family: TideFont
      fonts:
        - asset: assets/fonts/TideFont-Regular.ttf
        - asset: assets/fonts/TideFont-Bold.ttf
          weight: 700